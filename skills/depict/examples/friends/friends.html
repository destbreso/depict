  <noscript><p>This board plays with JavaScript. Its explanation: You know arrays: ask for slot 3 and you get it in one jump. But to find a contact by name, like Ana, you'd check slot after slot. A hash table turns the name, called the key, into a slot number. A hash function turns the key into a number, like 2,615, the same every time. Divide by the array's size, 4, and the remainder, 3, is the index. The array's slots are called buckets. This table has four. Index 3 means bucket 3: one jump, as with any array. Ana's entry, her name and her number, goes into bucket 3. Ben's name hashes to 1,847, and 1,847 % 4 is also 3: a collision. One way to handle it: the bucket keeps a list, and Ben goes after Ana. To find Ben, you jump to bucket 3 and compare keys down the list. Why is that fast? A good hash spreads keys evenly over the buckets. When it gets crowded, the table doubles its buckets and moves every key. So each list stays about one key long, however many keys you store. So a lookup is one jump and a check or two, for ten keys or ten million.</p></noscript>

t1":40.616,"draw0":36.049,"draw1":40.066,"still":40.366},{"say":"Index 3 means bucket 3: one jump, as with any array.","t0":40.616,"t1":44.36600000000001,"draw0":40.616,"draw1":40.656,"still":40.955999999999996},{"say":"Ana's entry, her name and her number, goes into bucket 3.","t0":44.36600000000001,"t1":48.428000000000004,"draw0":44.36600000000001,"draw1":46.489,"still":46.788999999999994},{"say":"Ben's name hashes to 1,847, and 1,847 % 4 is also 3: a collision.","t0":48.428000000000004,"t1":52.99100000000001,"draw0":48.428000000000004,"draw1":49.471000000000004,"still":49.771},{"say":"One way to handle it: the bucket keeps a list, and Ben goes after Ana.","t0":52.99100000000001,"t1":57.86600000000001,"draw0":52.99100000000001,"draw1":55.538999999999994,"still":55.839},{"say":"To find Ben, you jump to bucket 3 and compare keys down the list.","t0":57.86600000000001,"t1":63.128,"draw0":57.86600000000001,"draw1":58.458,"still":58.758},{"say":"Why is that fast? A good hash spreads keys evenly over the buckets.","t0":63.128,"t1":70.14399999999999,"draw0":64.285,"draw1":69.594,"still":69.89399999999999},{"say":"When it gets crowded, the table doubles its buckets and moves every key.","t0":70.14399999999999,"t1":75.14399999999999,"draw0":70.14399999999999,"draw1":73.469,"still":73.76899999999999},{"say":"So each list stays about one key long, however many keys you store.","t0":75.14399999999999,"t1":80.351,"draw0":75.664,"draw1":78.811,"still":79.111},{"say":"So a lookup is one jump and a check or two, for ten keys or ten million.","t0":80.351,"t1":85.351,"draw0":80.351,"draw1":84.318,"still":84.618}],"camera":[{"t0":4.365,"t1":5.265,"from":[754.3,82.7,1648.6],"to":[779,340,1661.4]},{"t0":16.986,"t1":18.2,"from":[779,340,1661.4],"to":[2614.6,350.9,1725.4]},{"t0":34.74,"t1":36.049,"from":[2614.6,350.9,1725.4],"to":[628.4,1199.8,1620.1]},{"t0":63.128,"t1":64.285,"from":[628.4,1199.8,1620.1],"to":[2259.9,1192.3,1760.1]},{"t0":85.351,"t1":86.431,"from":[2259.9,1192.3,1760.1 // The camera. A shot is a frame of the board: its center and its width (the
// height follows from 16:9). Between two shots the camera takes van Wijk and
// Nuij's path ("Smooth and efficient zooming and panning", InfoVis 2003),
// the one d3.interpolateZoom ships: it pulls back as it travels and comes in
// at the far end, so a long move never smears the board across the screen.
// This file has no imports: the page inlines it as it is.

const RHO = Math.SQRT2;
const RHO2 = 2;
const RHO4 = 4;

/** A shot from a frame { x, y, w, h }: center and width, the frame grown to 16:9 so all of it shows. */
function shotOf(f, aspect = 16 / 9) {
  const w = Math.max(f.w, f.h * aspect);
  return [f.x + f.w / 2, f.y + f.h / 2, w];
}

/**
 * A shot that shows a frame whole, centered. The caption is written under the
 * board, outside it, so the whole shot is the drawing's.
 */
function shotSafe(f, aspect = 16 / 9) {
  const h = Math.max(f.h, f.w / aspect);
  return [f.x + f.w / 2, f.y + f.h / 2, h * aspect];
}

/** The part of a shot nothing should be drawn outside of: all of it. */
function safeArea(shot, aspect = 16 / 9) {
  const [cx, cy, w] = shot;
  const h = w / aspect;
  return { x: cx - w / 2, y: cy - h / 2, w, h };
}

/** The path from shot a to shot b: a function of u in [0, 1], and the path's length (in the zoom metric). */
function flight(a, b) {
  const [ux0, uy0, w0] = a;
  const [ux1, uy1, w1] = b;
  const dx = ux1 - ux0;
  const dy = uy1 - uy0;
  const d2 = dx * dx + dy * dy;
  if (d2 < 1e-6) {
    const S = Math.log(w1 / w0) / RHO;
    return { S: Math.abs(S), at: (u) => [ux0 + u * dx, uy0 + u * dy, w0 * Math.exp(RHO * u * S)] };
  }
  const d1 = Math.sqrt(d2);
  const b0 = (w1 * w1 - w0 * w0 + RHO4 * d2) / (2 * w0 * RHO2 * d1);
  const b1 = (w1 * w1 - w0 * w0 - RHO4 * d2) / (2 * w1 * RHO2 * d1);
  const r0 = Math.log(Math.sqrt(b0 * b0 + 1) - b0);
  const r1 = Math.log(Math.sqrt(b1 * b1 + 1) - b1);
  const S = (r1 - r0) / RHO;
  return {
    S,
    at(u) {
      const s = u * S;
      const coshr0 = Math.cosh(r0);
      const k = (w0 / (RHO2 * d1)) * (coshr0 * Math.tanh(RHO * s + r0) - Math.sinh(r0));
      return [ux0 + k * dx, uy0 + k * dy, (w0 * coshr0) / Math.cosh(RHO * s + r0)];
    },
  };
}

/** A straight pan between shots, for slides: the next sheet slides in, nothing zooms out. */
function pan(a, b) {
  const S = Math.hypot(b[0] - a[0], b[1] - a[1]) / Math.max(a[2], b[2]);
  return { S, at: (u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u] };

/** How long a flight takes, in seconds: longer for longer paths, never a jump and never a crawl. */
const flightTime = (S) => Math.min(2.6, Math.max(0.9, 0.55 + 0.5 * S));

/** Ease in and out, so the camera leaves and arrives gently. */
const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);

/**
 * The camera at time t, from its keys: [{ t0, t1, from, to }] flights and
 * the holds between them. Returns a shot [cx, cy, width].

function cameraAt(keys, t) {
  let shot = keys[0].from;
  for (const k of keys) {
    if (t < k.t0) return shot;
    if (t < k.t1) return (k.pan ? pan : flight)(k.from, k.to).at(ease((t - k.t0) / (k.t1 - k.t0)));

  }
  return shot;

  for (const key of keys) {

    else break;
  }

  const [t0, pose, tx, ty] = key;
  const most = key[4] ?? Infinity; // how far the arm may reach before something in its way
  const P = actor.poses[pose] ?? actor.poses.rest;
  const at = ([u, v]) => [u * actor.h, (v - 0.99) * actor.h];
  const hand = (side) => ({ hand: at(P[side].hand), bow: at(P[side].bow), glove: P[side].glove });
  const front = hand("front");
  const back = hand("back");
  if ((pose === "point" || pose === "present") && tx != null) {
    // the front arm reaches toward the target from its shoulder: as far as an arm goes, and never back over its own head
    const sh = actor.shoulders.front;
    let dx = (tx - x) * facing - sh[0];
    let dy = ty - y - sh[1];
    const l = Math.hypot(dx, dy) || 1;
    dx /= l;
    dy /= l;
    if (dx < 0.25) {
      dx = 0.25;
      dy = Math.sign(dy || 1) * Math.sqrt(1 - dx * dx);
    }
    // as far as an arm goes, and never past the thing pointed at (less a pointer's length, when it holds one)
    const reach = Math.max(0.05 * actor.h, Math.min((actor.reach ?? 0.36) * actor.h, most, l - (actor.hold === "pointer" ? 0.27 * actor.h : 0)));
    const hx = sh[0] + dx * reach;
    const hy = sh[1] + dy * reach;
    // the hose sags a little under the line from shoulder to hand
    const nx = -dy;
    const ny = dx;
    const sag = ny > 0 ? 1 : -1;
    front.hand = [hx, hy];
    front.bow = [(sh[0] + hx) / 2 + nx * sag * 0.07 * actor.h, (sh[1] + hy) / 2 + ny * sag * 0.07 * actor.h];
    front.glove = "point";
  }
  if (pose === "wave") {
    // the hand swings side to side
    const w = Math.sin(2 * Math.PI * 2.4 * (t - t0));
    front.hand = [front.hand[0] + w * 0.055 * actor.h, front.hand[1] + Math.abs(w) * 0.012 * actor.h];
    front.bow = [front.bow[0] + w * 0.03 * actor.h, front.bow[1]];
  }
  if (pose === "cheer") {
    const w = Math.sin(2 * Math.PI * 1.8 * (t - t0));
    front.hand = [front.hand[0] + w * 0.02 * actor.h, front.hand[1] - Math.abs(w) * 0.02 * actor.h];
    back.hand = [back.hand[0] - w * 0.02 * actor.h, back.hand[1] - Math.abs(w) * 0.02 * actor.h];
  }
  if (pose === "scratch") {
    const w = Math.sin(2 * Math.PI * 3 * (t - t0));
    front.hand = [front.hand[0] + w * 0.012 * actor.h, front.hand[1] + w * 0.008 * actor.h];
  }
  return { front, back };
}

const mixHand = (a, b, u) => ({
  hand: [a.hand[0] + (b.hand[0] - a.hand[0]) * u, a.hand[1] + (b.hand[1] - a.hand[1]) * u],
  bow: [a.bow[0] + (b.bow[0] - a.bow[0]) * u, a.bow[1] + (b.bow[1] - a.bow[1]) * u],
  glove: u < 0.5 ? a.glove : b.glove,
});

/** A rubber-hose arm from the shoulder through its bow to the hand, as a polyline with the hose's own fixed wobble. */
function hosePath(sh, bow, hand, wobble) {
  const n = wobble.length;
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const s = 1 - t;
    const x = s * s * sh[0] + 2 * s * t * bow[0] + t * t * hand[0];
    const y = s * s * sh[1] + 2 * s * t * bow[1] + t * t * hand[1];
    // the direction along the curve, for the sideways wobble
    const dx = 2 * s * (bow[0] - sh[0]) + 2 * t * (hand[0] - bow[0]);
    const dy = 2 * s * (bow[1] - sh[1]) + 2 * t * (hand[1] - bow[1]);
    const l = Math.hypot(dx, dy) || 1;
    const w = wobble[i] * Math.sin(Math.PI * t);
    out.push(x - (dy / l) * w, y + (dx / l) * w);
  }
  return out;
}

// ------------------------------------------------------------------ the ways it arrives and leaves

/** How high it goes in the intros that leave the ground: the opening shot makes room for it. */
const INTRO_HEIGHT = { hop: 95, spin: 125, jump: 175, bounce: 110 };

/** A hop where it stands. */
const hopHere = (at, t0, t1, height) => ({ t0, t1, from: [at.x, at.y], to: [at.x, at.y], hops: 1, height, facing: at.facing, land: at.facing });

/**
 * The ways it comes alive once it is drawn. Each writes its keys from `a`,
 * the moment it is complete, and returns when it is ready to present the title.
 */
const INTROS = {
  wave: (k, a) => {
    k.bounces.push([a + 0.02, 1.1]);
    k.arms.push([a, "wave"]);
    return a + 1.2;
  },
  hop: (k, a, at) => {
    k.bounces.push([a, -0.6]);
    k.moves.push(hopHere(at, a + 0.1, a + 0.62, INTRO_HEIGHT.hop));
    k.bounces.push([a + 0.62, 0.9]);
    k.arms.push([a, "cheer"], [a + 0.7, "wave"]);
    return a + 1.5;
  },
  spin: (k, a, at) => {
    k.bounces.push([a, -0.6]);
    k.moves.push(hopHere(at, a + 0.1, a + 0.82, INTRO_HEIGHT.spin));
    k.spins.push([a + 0.12, a + 0.8, 1]);
    k.bounces.push([a + 0.82, 1.0]);
    k.arms.push([a, "cheer"], [a + 0.9, "wave"]);
    k.feel.push([a, "excited"], [a + 1.4, "happy"]);
    return a + 1.7;
  },
  bow: (k, a) => {
    k.arms.push([a, "rest"]);
    k.leans.push([a + 0.08, a + 1.0, 24]);
    k.feel.push([a + 0.08, "proud"], [a + 1.0, "happy"]);
    k.bounces.push([a + 1.0, 0.45]);
    k.arms.push([a + 1.0, "wave"]);
    return a + 1.9;
  },
  tip: (k, a) => {
    k.arms.push([a, "tip"]);
    k.caps.push([a + 0.2, a + 1.05, 0.075, 14]);
    k.feel.push([a + 0.2, "proud"], [a + 1.05, "happy"]);
    k.arms.push([a + 1.1, "wave"]);
    return a + 1.9;
  },
  jump: (k, a, at) => {
    k.bounces.push([a, -0.8]);
    k.moves.push(hopHere(at, a + 0.14, a + 0.78, INTRO_HEIGHT.jump));
    k.bounces.push([a + 0.78, 1.05]);
    k.arms.push([a + 0.1, "cheer"], [a + 0.86, "wave"]);
    k.feel.push([a, "excited"], [a + 1.4, "happy"]);
    return a + 1.7;
  },
  // a soft body's: it squashes deep, springs up, lands and bounces once more, wobbling on, and waves
  bounce: (k, a, at) => {
    k.bounces.push([a, -0.9]);
    k.moves.push(hopHere(at, a + 0.1, a + 0.66, INTRO_HEIGHT.bounce));
    k.bounces.push([a + 0.66, 1.2]);
    k.moves.push(hopHere(at, a + 0.74, a + 1.06, INTRO_HEIGHT.bounce * 0.35));
    k.bounces.push([a + 1.06, 0.8]);
    k.arms.push([a, "cheer"], [a + 1.12, "wave"]);
    k.feel.push([a, "excited"], [a + 1.6, "happy"]);
    return a + 2.0;
  },
  // it shakes itself awake like a jelly, arms out, then waves
  jiggle: (k, a) => {
    k.bounces.push([a, 1.1], [a + 0.32, -0.8], [a + 0.62, 0.6]);
    k.arms.push([a, "shrug"], [a + 0.95, "wave"]);
    k.feel.push([a, "excited"], [a + 1.5, "happy"]);
    return a + 1.9;
  },
};

/** The ways the guide says goodbye as the camera comes in on it: keys from `t`, the camera arriving at `t + fly`, the circle closing after `iris.hold`. */
const OUTROS = {
  wave: (k, t) => k.arms.push([t + 0.15, "wave"]),
  bow: (k, t, fly, iris) => {
    k.arms.push([t + 0.15, "wave"], [t + fly - 0.15, "rest"]);
    k.leans.push([t + fly - 0.1, iris.hold + 0.08, 26]);
    k.feel.push([t + fly - 0.1, "proud"]);
  },
  cheer: (k, t, fly, iris, at) => {
    k.arms.push([t + 0.15, "cheer"]);
    k.moves.push(hopHere(at, t + fly - 0.5, t + fly + 0.08, 85));
    k.bounces.push([t + fly + 0.08, 0.8]);
    k.feel.push([t + 0.15, "excited"]);
  },
  salute: (k, t, fly) => {
    k.arms.push([t + 0.15, "wave"], [t + fly - 0.3, "salute"]);
    k.feel.push([t + fly - 0.3, "proud"]);
  },
  tip: (k, t, fly, iris) => {
    k.arms.push([t + 0.15, "wave"], [t + fly - 0.3, "tip"]);
    k.caps.push([t + fly - 0.15, iris.hold + 0.15, 0.075, 14]);
    k.feel.push([t + fly - 0.15, "proud"]);
  },
  spin: (k, t, fly, iris, at) => {
    k.moves.push(hopHere(at, t + fly - 0.7, t + fly + 0.05, 115));
    k.spins.push([t + fly - 0.68, t + fly + 0.03, 1]);
    k.bounces.push([t + fly + 0.05, 0.85]);
    k.arms.push([t + 0.15, "cheer"], [t + fly + 0.1, "wave"]);
  },
  // a soft body's goodbye: two happy bounces, the second smaller, wobbling on as the circle closes
  bounce: (k, t, fly, iris, at) => {
    k.arms.push([t + 0.15, "cheer"]);
    k.moves.push(hopHere(at, t + fly - 0.75, t + fly - 0.3, 75));
    k.bounces.push([t + fly - 0.3, 1.0]);
    k.moves.push(hopHere(at, t + fly - 0.22, t + fly + 0.06, 32));
    k.bounces.push([t + fly + 0.06, 0.7]);
    k.feel.push([t + 0.15, "excited"]);
  },
};

// ------------------------------------------------------------------ casting another guide

/** The poses every character has; any other is a quirk's (Stuart's glasses), and a character without that quirk rests instead. */
const OWN_POSES = ["rest", "present", "wave", "cheer", "shrug", "scratch", "salute", "tip", "point"];
/** The brows, mouths and closed eyes of the other feelings: ready when the guide is drawn, hidden until needed. */
const WAITING = /^brows:(?!up$)|^mouth:(?!smile$)|^squint/;
const lengthOf = (pts) => {
  let l = 0;
  for (let i = 2; i < pts.length; i += 2) l += Math.hypot(pts[i] - pts[i - 2], pts[i + 1] - pts[i - 1]);
  return l;
};

/**
 * When each stroke of a guide is drawn as it first appears, in its drawing order, between t0 and t1 (the span the
 * board gave its own guide): its outline, face, arms and gloves (four strokes the page draws from the pose), legs
 * and color, each for a time in proportion to its length, as the timeline times a guide (timeline.mjs, drawGuide).
 * Sets t0 and t1 on each stroke and returns the arms' and gloves' spans.
 */
function drawOn(strokes, armsAt, h, t0, t1) {
  const items = [];
  for (const s of strokes) if (!WAITING.test(s.part)) items.push({ n: s.n, s, len: lengthOf(s.pts) * (s.l === 0 ? 1 : 0.3) });
  ["armBack", "gloveBack", "armFront", "gloveFront"].forEach((name, i) => items.push({ n: armsAt + i, name, len: name.startsWith("arm") ? 0.42 * h : 0.5 * h }));
  items.sort((a, b) => a.n - b.n);
  const total = items.reduce((a, x) => a + x.len, 0) || 1;
  const lift = 0.015;
  const room = Math.max(0.3, t1 - t0 - lift * items.length);
  let at = t0;
  const reveal = {};
  for (const x of items) {
    const d = (room * x.len) / total;
    if (x.s) {
      x.s.t0 = at;
      x.s.t1 = at + d;
    } else reveal[x.name] = [at, at + d];
    at += d + lift;
  }
  for (const s of strokes) if (WAITING.test(s.part)) s.t0 = s.t1 = at;
  return reveal;
}

/** The span a board gave its guide to be drawn in as it first appears. */
function drawnIn(A) {
  let a = Infinity;
  let b = -Infinity;
  for (const s of A.strokes) if (!WAITING.test(s.part) && s.t1 > s.t0) (a = Math.min(a, s.t0)), (b = Math.max(b, s.t1));
  for (const k in A.reveal || {}) (a = Math.min(a, A.reveal[k][0])), (b = Math.max(b, A.reveal[k][1]));
  return [a, b + 0.015];
}

/**
 * A board is directed by its slot: the gestures it has its guide make were worked out with the slot's shoulders
 * and reach. A guide with a body of its own (narrower, with shorter arms) makes them from its own shoulders: where
 * its arm on the way to a thing would cross something the slot's would not, or its finger, out of its reach, would
 * stop in the air beside another thing or with another ahead of it, it looks at the thing instead of pointing, its
 * hands at rest. A is the guide as a page carries it, with `slot` ({ front, reach }); elements are the page's
 * ({ kind, t0, box: [x, y, w, h] }).
 */
function keepClear(A, elements) {
  const S = A.slot;
  if (!S) return A;
  const reach = (A.reach ?? 0.36) * A.h;
  if (S.front[0] === A.shoulders.front[0] && S.front[1] === A.shoulders.front[1] && Math.abs(S.reach * A.h - reach) < 0.5) return A;
  const h = A.h;
  const tip = 0.13 * h + (A.hold === "pointer" ? 0.27 * h : 0) + 12;
  const solid = elements.filter((e) => e.box && (e.kind === "item" || e.kind === "note" || e.kind === "region" || e.kind === "title"));
  const near = (b, x, y, m) => x > b[0] - m && x < b[0] + b[2] + m && y > b[1] - m && y < b[1] + b[3] + m;
  const holds = (o, b) => o[0] <= b[0] && o[1] <= b[1] && o[0] + o[2] >= b[0] + b[2] && o[1] + o[3] >= b[1] + b[3];
  // what is in the way from a shoulder to the point it aims at: on the line, and, out of reach, by the finger or ahead of it
  const blockers = (sx, sy, arm, tx, ty, tbox, others) => {
    const found = new Set();
    const d = Math.hypot(tx - sx, ty - sy) || 1;
    for (let r = 0; r < d; r += 6) {
      const x = sx + ((tx - sx) * r) / d;
      const y = sy + ((ty - sy) * r) / d;
      if (tbox && near(tbox, x, y, 6)) break;
      for (const o of others) if (near(o.box, x, y, 6)) found.add(o);
    }
    const full = arm + tip;
    if (d > full) {
      const [ux, uy] = [(tx - sx) / d, (ty - sy) / d];
      const [x, y] = [sx + ux * full, sy + uy * full];
      for (const o of others) {
        const b = o.box;
        const px = b[0] + b[2] / 2 - x;
        const py = b[1] + b[3] / 2 - y;
        const along = px * ux + py * uy;
        const across = Math.abs(px * uy - py * ux);
        if (near(b, x, y, 0.12 * h) || (along > 0 && along < d - full && across < 0.21 * along + Math.hypot(b[2], b[3]) / 2)) found.add(o);
      }
    }
    return found;
  };
  const arms = A.track.arms.map((k) => {
    if (k[1] !== "point" || k.length < 4) return k;
    const [t, , tx, ty] = k;
    const st = actorAt(A, t + 0.05);
    const at = (sh) => [st.x + st.facing * sh[0], st.y + sh[1]];
    const shown = solid.filter((e) => e.t0 <= t + 0.05);
    // the thing it points at: the smallest thing drawn round the point it aims at (and whatever frames it is not in the way)
    const target = shown.filter((e) => near(e.box, tx, ty, 2)).sort((a, b) => a.box[2] * a.box[3] - b.box[2] * b.box[3])[0];
    const tbox = target ? target.box : null;
    const others = shown.filter((e) => e !== target && !(tbox && holds(e.box, tbox)));
    const mine = blockers(...at(A.shoulders.front), reach, tx, ty, tbox, others);
    if (!mine.size) return k;
    const theirs = blockers(...at(S.front), S.reach * h, tx, ty, tbox, others);
    for (const o of mine) if (!theirs.has(o)) return [t, "rest"];
    return k;
  });
  return { ...A, track: { ...A.track, arms } };
}

/**
 * A guide's track for another character, who is who it is: it comes alive its own way, says goodbye its own way, and
 * does its own quirks in the board's quiet moments. The board's own way is kept when it is one of this character's
 * too; otherwise the board's seed picks among its own, and an arrival never leaves the ground higher than the board's
 * own did (the opening shot made room for that one). Everything else (where it goes, what it points at and feels) is
 * the board's.
 */
function personalize(track, look) {
  const tuples = (list) => (list || []).map((x) => [...x]);
  const k = { ...track, moves: (track.moves || []).map((m) => ({ ...m })) };
  for (const key of ["arms", "feel", "look", "bounces", "spins", "leans", "caps"]) k[key] = tuples(track[key]);
  const blank = () => ({ moves: [], arms: [], feel: [], look: [], bounces: [], spins: [], leans: [], caps: [] });
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const take = (made) => {
    for (const key in made) for (const e of made[key]) {
      const i = k[key].findIndex((x) => same(x, e));
      if (i >= 0) k[key].splice(i, 1);
    }
  };
  const put = (made) => {
    for (const key in made) k[key].push(...made[key]);
  };
  const choose = (old, own, fits) => {
    if (own.includes(old.kind)) return old.kind;
    const fit = own.filter(fits);
    return fit.length ? fit[old.seed % fit.length] : old.kind;
  };
  const arrive = track.intro;
  if (arrive && INTROS[arrive.kind]) {
    const high = INTRO_HEIGHT[arrive.kind] ?? 0;
    const kind = choose(arrive, look.intros || [], (x) => INTROS[x] && (INTRO_HEIGHT[x] ?? 0) <= high);
    if (kind !== arrive.kind) {
      const was = blank();
      const ready0 = INTROS[arrive.kind](was, arrive.at, arrive.from);
      take(was);
      const now = blank();
      const ready1 = INTROS[kind](now, arrive.at, arrive.from);
      put(now);
      // it presents the title once it is ready, its own arrival done
      if (arrive.title != null) {
        const [a, b] = [Math.max(arrive.title, ready0), Math.max(arrive.title, ready1)];
        for (const key of k.arms) if (key[1] === "present" && Math.abs(key[0] - a) < 1e-9) key[0] = b;
      }
      k.intro = { ...arrive, kind };
    }
  }
  const leave = track.outro;
  if (leave && OUTROS[leave.kind]) {
    const kind = choose(leave, look.outros || [], (x) => Boolean(OUTROS[x]));
    if (kind !== leave.kind) {
      const iris = { hold: leave.hold };
      const was = blank();
      OUTROS[leave.kind](was, leave.t, leave.fly, iris, leave.at);
      take(was);
      const now = blank();
      OUTROS[kind](now, leave.t, leave.fly, iris, leave.at);
      put(now);
      k.outro = { ...leave, kind };
    }
  }
  // its own quirks in the quiet moments: the board's guide's go, and this one's own come, if it has any
  const quiet = track.quirks || [];
  if (quiet.length) {
    const mine = (look.quirks || []).filter((q) => look.poses[q]);
    const at = new Set(quiet.flatMap(([a, b]) => [a, b]));
    k.arms = k.arms.filter((x) => !at.has(x[0]));
    quiet.forEach(([a, b], i) => {
      if (mine.length) k.arms.push([a, mine[i % mine.length]], [b, "rest"]);
    });
  }
  for (const key of ["arms", "feel", "look", "bounces", "spins", "leans", "caps"]) k[key].sort((a, b) => a[0] - b[0]);
  k.moves.sort((a, b) => a.t0 - b.t0);
  return k;
}

/**
 * The days of the year a guide can dress for, in the viewer's own calendar, from [month, day] to [month, day]: the
 * holidays first, then the seasons. A host that asks for today's outfit (`outfit: "today"`) has a character wear its
 * own outfit for the first of them it has one for, and its board's dress on any other day; any other name is the
 * host's own (a school's sports day, a birthday).
 */
const OCCASIONS = [
  { name: "New Year", from: [12, 31], to: [1, 1] },
  { name: "Valentine's Day", from: [2, 10], to: [2, 14] },
  { name: "St. Patrick's Day", from: [3, 14], to: [3, 17] },
  { name: "Fourth of July", from: [7, 1], to: [7, 4] },
  { name: "Halloween", from: [10, 18], to: [10, 31] },
  { name: "Christmas", from: [12, 1], to: [12, 26] },
  { name: "winter", from: [12, 1], to: [2, 29] },
  { name: "summer", from: [6, 21], to: [8, 31] },
];

/** The occasions of a day, most particular first: Thanksgiving's week (the fourth Thursday of November), a holiday, a season. */
function occasionsOn(date = new Date()) {
  const m = date.getMonth() + 1;
  const d = date.getDate();
  const key = m * 100 + d;
  const within = ([m0, d0], [m1, d1]) => (m0 * 100 + d0 <= m1 * 100 + d1 ? key >= m0 * 100 + d0 && key <= m1 * 100 + d1 : key >= m0 * 100 + d0 || key <= m1 * 100 + d1);
  const out = OCCASIONS.filter((o) => within(o.from, o.to)).map((o) => o.name);
  const thursday = 1 + ((4 - new Date(date.getFullYear(), 10, 1).getDay() + 7) % 7) + 21;
  if (m === 11 && d >= thursday - 3 && d <= thursday + 1) out.unshift("Thanksgiving");
  return out;
}

/** Why a look cannot present a board in place of its guide A, or null when it can. */
function castProblem(A, look) {
  if (!look || look.depict !== "look" || look.version !== 1) return "that is not a character's look (scripts/look.mjs makes one)";
  if (!A.contract) return "this board was built before characters had bodies to share: build it again to cast another guide in it";
  if (look.contract !== A.contract) return `${look.name} has ${look.contract}'s body and this board's guide has ${A.contract}'s: a character presents only the boards made for its body`;
  if (Math.abs(look.h - A.h) > 0.5) return `${look.name} is drawn ${look.h} tall and this board's guide ${Math.round(A.h * 10) / 10}: make its look again with this board's kit`;
  return null;
}

/**
 * The guide A of a board, played by another character of its body: the board's own performance (where it stands,
 * how it hops, what it points at and feels), the costumes the board puts on it that this character can wear, and
 * what it holds; this character's body, face, arms and hands, drawn as it first appears in the span A was, and
 * moving as its own material does. A pose of a quirk it does not have (Stuart's glasses) becomes rest, and a gesture
 * its own arm would not make cleanly becomes a look (keepClear). `palette` is the page's: the look's colors join it,
 * and its open accent is the board's; `elements` are the page's; `dress` is what the host asks it to wear:

      const glove = side === "front" && A.hold === "pointer" ? "fist" : arm.glove;
      if (side === "front" && A.hold === "pointer") {
        X.pointerG.setAttribute("transform", `translate(${arm.hand[0]} ${arm.hand[1]}) rotate(${arm.glove === "point" ? ang : -62})`);
        X.pointerG.setAttribute("opacity", Math.min(1, gf * 1.6));
      }
      for (const kind in X.gloves[side]) X.gloves[side][kind].style.display = kind === glove && gf > 0 ? "" : "none";
    }
    if (!tip) return null;
    return { x: st.x + st.facing * st.sx * tip.x, y: st.y - st.lift + st.sy * tip.y };
  }

  const card = (S.outro ? S.outro.card : []).map((c) => {
    const n = node("path", { stroke: S.palette[c.c], "stroke-width": c.w, fill: "none" }, outroLayer);
    n.style.display = "none";
    return Object.assign(measured(c.pts), { t0: c.t0, t1: c.t1, node: n });
  });
  const smooth = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
  /** The outro at time t: the circle closing on the guide, then the title written on the dark. Played, never paused over. */
  let fading = false; // the title on the dark, fading away to leave the whole board when the film is over
  function renderOutro(t, shot) {
    if (fading) return;
    const O = S.outro;
    const on = O && t >= O.iris.t0 && (capture || playing);
    outroLayer.style.display = on ? "" : "none";
    if (!on) return;
    const I = O.iris;
    const k = VW / shot[2];
    const sx = (I.cx - shot[0]) * k + VW / 2;
    const sy = (I.cy - shot[1]) * k + VH / 2;
    const far = Math.hypot(Math.max(sx, VW - sx), Math.max(sy, VH - sy)) / k;
    let r;
    if (t < I.hold) r = far + (I.r - far) * smooth((t - I.t0) / (I.hold - I.t0));
    else if (t < I.close) r = I.r;
    else if (t < I.t1) r = I.r * (1 - smooth((t - I.close) / (I.t1 - I.close)));
    else r = 0;
    const rs = r * k;
    iris.setAttribute("d", `M-20 -20H${VW + 20}V${VH + 20}H-20Z` + (rs > 0.5 ? `M${sx + rs} ${sy}A${rs} ${rs} 0 1 0 ${sx - rs} ${sy}A${rs} ${rs} 0 1 0 ${sx + rs} ${sy}Z` : ""));
    for (const c of card) {
      if (t < c.t0) {
        c.node.style.display = "none";
        continue;
      }
      c.node.style.display = "";
      c.node.setAttribute("d", t >= c.t1 ? pathOf(c.pts, c.pts.length) : partial(c, c.len * ((t - c.t0) / (c.t1 - c.t0))).d);
    }
  }

  let now = 0;
  /** Draws the board as it is at time t. */
  function render(t) {
    now = Math.max(0, Math.min(T, t));
    setCam(view ?? camAt(now));
    let tip = null;
    for (const s of strokes) {
      const state = now < s.t0 ? 0 : now >= s.t1 ? 2 : 1;
      if (state === 0) {
        if (s.node && s.shown !== 0) {
          s.node.style.display = "none";
          s.shown = 0;
        }
        s.state = 0;
        continue;
      }
      const node = nodeOf(s);
      if (s.shown !== 1) {
        node.style.display = "";
        s.shown = 1;
      }
      if (state === 2) {
        if (s.state !== 2) node.setAttribute("d", pathOf(s.pts, s.pts.length));
      } else {
        const p = partial(s, s.len * ((now - s.t0) / (s.t1 - s.t0)));
        node.setAttribute("d", p.d);
        tip = p;
      }
      s.state = state;
    }
    for (const X of actors) {
      const at = renderActor(X, now, null);
      if (at) tip = at;
    }
    // the pen follows the tip of whatever is being drawn, and rests between strokes of a beat
    const b = beatAt(now);
    if (!tip && b && now >= b.draw0 && now < b.draw1) {
      const last = lastDrawn(now);
      if (last) tip = { x: last.pts[last.pts.length - 2], y: last.pts[last.pts.length - 1] };
    }
    if (tip && !capture) {
      pen.style.display = "";
      pen.setAttribute("transform", `translate(${tip.x} ${tip.y}) scale(${pen.dataset.k * 1.15})`);
    } else if (tip && capture) {
      pen.style.display = "";
      pen.setAttribute("transform", `translate(${tip.x} ${tip.y}) scale(${pen.dataset.k * 1.15})`);
    } else pen.style.display = "none";
    showCaption(b);
    renderOutro(now, shotNow);
    updateBar();
  }
  const beatAt = (t) => {
    for (let i = beats.length - 1; i >= 0; i--) if (t >= beats[i].t0) return t < beats[i].t1 ? { ...beats[i], i } : null;
    return null;
  };
  const lastDrawn = (t) => {
    let best = null;
    for (const s of strokes) if (s.t1 <= t && (!best || s.t1 > best.t1)) best = s;
    return best;
  };
  let captionFor = -1;
  function showCaption(b) {
    const i = b ? b.i : -1;
    if (i === captionFor) return;
    captionFor = i;
    // the last sentence stays in the caption while it fades out
    if (b) caption.textContent = b.say;
    caption.classList.toggle("on", !!b);
  }

  // playing: the board's own speed is 1x (a child's board, half the film's speed), and the menu goes either way from it
  const own = S.speed || 1;
  let playing = false;
  let speed = own;
  let last = 0;
  let failed = false;
  const tick = (ms) => {
    if (!playing) return;
    // a frame is never more than a tenth of a second: back from a hidden tab, the film goes on from where it was
    const dt = last ? Math.min(0.1, (ms - last) / 1000) : 0;
    last = ms;
    try {
      render(now + dt * speed);
      watchOpen();
    } catch (err) {
      // one bad frame never stops the film
      if (!failed) console.error("depict: a frame failed to draw", err);
      failed = true;
      now = Math.min(T, now + dt * speed);
    }
    if (now >= T) {
      playing = false;
      ended();
      return;
    }
    remember();
    requestAnimationFrame(tick);
  };
  function play() {
    if (!playing) tell("play");
    unfade();
    // from the end, or from the board at rest after it, the film starts again from the beginning
    if (now >= T || root.classList.contains("ended")) seek(0);
    root.classList.remove("fresh");
    view = null;
    playing = true;
    last = 0;
    root.classList.add("playing");
    root.classList.remove("ended");
    requestAnimationFrame(tick);
  }
  function pause() {
    if (playing) tell("pause");
    playing = false;
    root.classList.remove("playing");
    forget();
  }
  function seek(t) {
    view = null;
    render(t);
  }
  function ended() {
    root.classList.remove("playing");
    // the title on the dark stays a moment and fades away over the whole board, which stays to explore
    const veil = S.outro && outroLayer.style.display !== "none";
    if (veil) {
      fading = true;
      outroLayer.style.transition = "opacity .9s ease";
      outroLayer.getBoundingClientRect();
      outroLayer.style.opacity = "0";
      setTimeout(unfade, 950);
    }
    if (S.explore != null) render(S.explore);
    root.classList.add("ended");
    forget();
    tell("ended");
  }
  function unfade() {
    if (!fading) return;
    fading = false;
    outroLayer.style.display = "none";
    outroLayer.style.transition = "";
    outroLayer.style.opacity = "";
  }
  // where the film was, while it plays, kept every frame: a page reloaded under the viewer (a preview that
  // refreshes whenever a file in its folder changes) goes on from the very frame it was showing, neither
  // starting over nor showing a moment again. Best effort: storage may be missing or blocked.
  const KEY = `depict:${location.pathname}`;
  function remember() {
    if (capture) return;
    try {
      sessionStorage.setItem(KEY, JSON.stringify({ t: now, at: Date.now() }));
    } catch {}
  }
  addEventListener("pagehide", () => playing && remember());
  function forget() {
    try {
      sessionStorage.removeItem(KEY);
    } catch {}
  }

  // the bar
  const bar = root.querySelector(".dp-bar");
  const playBtn = bar.querySelector(".dp-play");
  const scrub = bar.querySelector(".dp-scrub");
  const clock = bar.querySelector(".dp-time");
  const ticks = bar.querySelector(".dp-ticks");
  scrub.max = String(T);
  for (const b of beats) {
    const m = document.createElement("i");
    m.style.left = `${(100 * b.t0) / T}%`;
    ticks.append(m);
  }
  const fmt = (s) => {
    const r = Math.round(s);
    return `${Math.floor(r / 60)}:${String(r % 60).padStart(2, "0")}`;
  };
  function updateBar() {
    scrub.value = String(now);
    // the clock runs at the board's own speed: it ends at the length the start button promised; before the film
    // has played, while the whole board waits behind the start button, it reads from the beginning
    clock.textContent = `${fmt(root.classList.contains("fresh") ? 0 : now / own)} / ${fmt(T / own)}`;
    playBtn.setAttribute("aria-label", playing ? "Pause" : now >= T || root.classList.contains("ended") ? "Replay" : "Play");
  }
  playBtn.addEventListener("click", () => (playing ? pause() : play()));
  scrub.addEventListener("input", () => {
    pause();
    seek(Number(scrub.value));
  });
  const step = (dir) => {
    pause();
    const i = beats.findIndex((b) => now < b.t1);
    const cur = i < 0 ? beats.length : i;
    const j = Math.max(0, Math.min(beats.length - 1, cur + dir));
    seek(dir < 0 && now - beats[cur]?.t0 > 1 ? beats[cur].t0 : beats[j].t0);
  };
  bar.querySelector(".dp-prev").addEventListener("click", () => step(-1));
  bar.querySelector(".dp-next").addEventListener("click", () => step(1));
  bar.querySelector(".dp-speed").addEventListener("change", (e) => (speed = own * Number(e.target.value)));
  root.addEventListener("keydown", (e) => {
    if (e.target.closest("select")) return;
    if (e.key === " " || e.key === "k") {
      e.preventDefault();
      playing ? pause() : play();
    } else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "Home") seek(0);
    else if (e.key === "End") seek(T);
  });

  // exploring: zoom and drag the board; tap a part to hear it again
  const toBoard = (ev) => {
    const r = svg.getBoundingClientRect();
    const sx = ((ev.clientX - r.left) / r.width) * VW;
    const sy = ((ev.clientY - r.top) / r.height) * VH;
    const k = shotNow[2] / VW;
    return [shotNow[0] + (sx - VW / 2) * k, shotNow[1] + (sy - VH / 2) * k];
  };
  const visible = (e) => now >= e.t0;
  const hit = (ev) => {
    const [x, y] = toBoard(ev);
    let best = null;
    for (const e of S.elements) {
      if (!visible(e)) continue;
      const [bx, by, bw, bh] = e.box;
      if (x >= bx - 12 && x <= bx + bw + 12 && y >= by - 12 && y <= by + bh + 12 && (!best || bw * bh < best.box[2] * best.box[3])) best = e;
    }
    return best;
  };
  svg.addEventListener(
    "wheel",
    (ev) => {
      ev.preventDefault();
      pause();
      const [x, y] = toBoard(ev);
      const f = Math.exp(ev.deltaY * 0.0015);
      const w = Math.min(S.overview[2] * 1.6, Math.max(300, shotNow[2] * f));
      // zoom about the pointer
      const g = w / shotNow[2];
      view = [x + (shotNow[0] - x) * g, y + (shotNow[1] - y) * g, w];
      setCam(view);
    },
    { passive: false },
  );
  // one finger (or the mouse) drags the board; two fingers pinch it, zooming about the point between them
  let drag = null;
  let pinch = null;
  let gesture = false; // a drag or a pinch is going on: lifting the fingers is not a tap
  const fingers = new Map();
  const toSvg = (px, py) => {
    const r = svg.getBoundingClientRect();
    return [((px - r.left) / r.width) * VW, ((py - r.top) / r.height) * VH];
  };
  const pair = () => {
    const [a, b] = [...fingers.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  };
  svg.addEventListener("pointerdown", (ev) => {
    fingers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    svg.setPointerCapture(ev.pointerId);
    if (fingers.size === 2) {
      const p = pair();
      const [sx, sy] = toSvg(p.mx, p.my);
      const k = shotNow[2] / VW;
      // the point of the board between the fingers stays between them
      pinch = { d: p.d, bx: shotNow[0] + (sx - VW / 2) * k, by: shotNow[1] + (sy - VH / 2) * k, w: shotNow[2] };
      drag = null;
      gesture = true;
      pause();
      return;
    }
    if (fingers.size === 1) {
      drag = { x: ev.clientX, y: ev.clientY, shot: shotNow, moved: false };
      gesture = false;
    }
  });
  const lift = (ev) => {
    fingers.delete(ev.pointerId);
    if (fingers.size < 2) pinch = null;
  };
  svg.addEventListener("pointercancel", (ev) => {
    lift(ev);
    drag = null;
  });
  svg.addEventListener("pointermove", (ev) => {
    if (fingers.has(ev.pointerId)) fingers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pinch && fingers.size >= 2) {
      const p = pair();
      const w = Math.min(S.overview[2] * 1.6, Math.max(300, (pinch.w * pinch.d) / p.d));
      const [sx, sy] = toSvg(p.mx, p.my);
      const k = w / VW;
      view = [pinch.bx - (sx - VW / 2) * k, pinch.by - (sy - VH / 2) * k, w];
      setCam(view);
      return;
    }
    if (drag) {
      const r = svg.getBoundingClientRect();
      const k = drag.shot[2] / r.width;
      const dx = (ev.clientX - drag.x) * k;
      const dy = (ev.clientY - drag.y) * k;
      if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) > 4) {
        drag.moved = true;
        gesture = true;
        pause();
        view = [drag.shot[0] - dx, drag.shot[1] - dy, drag.shot[2]];
        setCam(view);
      }
      return;
    }
    const e = playing ? null : hit(ev);
    svg.style.cursor = e ? "pointer" : "grab";
    if (e) {
      const [bx, by, bw, bh] = e.box;
      hoverBox.setAttribute("x", bx - 14);
      hoverBox.setAttribute("y", by - 14);
      hoverBox.setAttribute("width", bw + 28);
      hoverBox.setAttribute("height", bh + 28);
      hoverBox.style.display = "";
    } else hoverBox.style.display = "none";
  });
  svg.addEventListener("pointerup", (ev) => {
    lift(ev);
    drag = null;
    // the last finger of a drag or a pinch lifts: no tap
    if (gesture) {
      if (!fingers.size) gesture = false;
      return;
    }
    if (fingers.size) return;
    if (playing) return pause();
    // the guide answers a tap with a hop and a wave
    const [bx, by] = toBoard(ev);
    for (const X of actors) {
      const st = actorAt(X.A, now);
      if (st.shown && Math.abs(bx - st.x) < 0.36 * X.A.h && by < st.y + 10 && by > st.y - X.A.h) {
        X.react = performance.now() / 1000;
        return;
      }
    }
    const e = hit(ev);
    if (e && e.figure) openLive(e, false);
    else if (e) {
      // back to the moment this part was explained, and on from there
      seek(beats[e.beat].t0);
      play();
    } else play();
  });
  svg.addEventListener("dblclick", () => {
    view = null;
    setCam(camAt(now));
  });

  // live parts: an item with a Dissect figure opens into it, grown from where the item sits on the board
  const liveBox = root.querySelector(".dp-live");
  const frameEl = root.querySelector(".dp-frame");
  const live = { open: false, resume: false };
  const screenRect = (box) => {
    const fr = frameEl.getBoundingClientRect();
    const k = VW / shotNow[2];
    const s = fr.width / VW;
    const [bx, by, bw, bh] = box;
    return { x: ((bx - shotNow[0]) * k + VW / 2) * s, y: ((by - shotNow[1]) * k + VH / 2) * s, w: bw * k * s, h: bh * k * s, fw: fr.width, fh: fr.height };
  };
  function openLive(e, resume) {
    if (capture || !e.figure) return;
    pause();
    live.open = true;
    live.resume = resume;
    let frame = liveBox.querySelector("iframe");
    if (!frame || frame.dataset.src !== e.figure) {
      frame?.remove();
      frame = document.createElement("iframe");
      frame.dataset.src = e.figure;
      frame.src = e.figure;
      frame.title = `${e.label}: a running figure`;
      liveBox.prepend(frame);
    }
    liveBox.querySelector(".dp-live-name").textContent = `${e.label}, running`;
    const r = screenRect(e.box);
    liveBox.style.transition = "none";
    liveBox.style.transform = `translate(${r.x}px, ${r.y}px) scale(${r.w / r.fw}, ${r.h / r.fh})`;
    liveBox.style.opacity = "0.4";
    liveBox.hidden = false;
    liveBox.offsetWidth; // the start state is laid out before the transition runs
    liveBox.style.transition = "";
    liveBox.style.transform = "none";
    liveBox.style.opacity = "1";
    liveBox.dataset.el = String(S.elements.indexOf(e));
    liveBox.querySelector(".dp-live-close").focus();
  }
  function closeLive() {
    if (!live.open) return;
    live.open = false;
    const e = S.elements[Number(liveBox.dataset.el)];
    const r = screenRect(e.box);
    liveBox.style.transform = `translate(${r.x}px, ${r.y}px) scale(${r.w / r.fw}, ${r.h / r.fh})`;
    liveBox.style.opacity = "0";
    setTimeout(() => (liveBox.hidden = true), 450);
    root.focus();
    if (live.resume) play();
  }
  liveBox.querySelector(".dp-live-close").addEventListener("click", closeLive);
  root.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") closeLive();
  });
  // a beat that opens a live part does it as the beat starts, and the explanation waits for the reader
  let lastBeat = -1;
  const watchOpen = () => {
    const b = beatAt(now);
    const i = b ? b.i : -1;
    if (i !== lastBeat) {
      lastBeat = i;
      if (playing && b && b.open != null) setTimeout(() => openLive(S.elements[b.open], true), 900);
    }
  };

  // paused or ended, the guide stays alive: it breathes and blinks while the reader looks round the board
  if (!capture && actors.length) {
    const idle = (ms) => {
      if (!playing && !reduced) for (const X of actors) renderActor(X, now, ms / 1000);
      requestAnimationFrame(idle);
    };
    requestAnimationFrame(idle);
  }

  window.depict = { render, seek, play, pause, cast, occasions: occasionsOn, duration: T, explore: S.explore, speed: S.speed || 1, beats, get time() { return now; } };
  // the host of an embedded page hears ready, play, pause and ended, and size whenever the height the page
  // wants (the board as wide as the frame, with its bar and caption under it) or the board's place in it changes:
  // `box`, [x, y, width, height] of the board in the frame, so a host can lay a picture exactly over it
  function tell(event, more) {
    if (!embedded) return;
    try {
      window.parent.postMessage({ depict: { event, t: now, duration: T, speed: own, title: S.title, ...more } }, "*");
    } catch {}
  }
  let told = "";
  const want = () => {
    const cs = getComputedStyle(root);
    const pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const r = root.querySelector(".dp-frame").getBoundingClientRect();
    return { height: Math.ceil(((innerWidth - pad) * 9) / 16 + (parseFloat(cs.getPropertyValue("--dp-reserve")) || 200)), box: [r.left, r.top, r.width, r.height].map((v) => Math.round(v * 10) / 10) };
  };
  if (embedded)
    addEventListener("resize", () => {
      const w = want();
      const key = JSON.stringify(w);
      if (key !== told) {
        told = key;
        tell("size", w);
      }
    });
  hoverBox.style.display = "none";
  const at = q.get("t");
  let resume = null;
  try {
    const r = JSON.parse(sessionStorage.getItem(KEY) || "null");
    if (r && Date.now() - r.at < 20000 && r.t < T) resume = r.t;
  } catch {}
  if (!capture && at == null && resume != null) {
    // it was playing a moment ago: go on from there
    seek(resume);
    play();
  } else {
    render(at != null ? Number(at) : capture ? 0 : S.explore ?? T);
    if (!capture && at == null) {
      root.classList.add("ended", "fresh");
      updateBar();
    }
  }
  document.documentElement.dataset.ready = "1";
  if (embedded) {
    const w = want();
    told = JSON.stringify(w);
    tell("ready", w);
    // a host that was not listening yet (its own page still starting) says hello, and hears ready again; a host
    // can also start the film and pause it (its own play button, over the board)
    addEventListener("message", (e) => {
      if (e.source !== window.parent || !e.data) return;
      const say = e.data.depict;
      if (say === "hello") tell("ready", want());
      else if (say === "play" && !playing) play();
      else if (say === "pause" && playing) pause();
      // the host casts another character of the guide's body (its look), or the board's own back (null), and hears how it went
      else if (say === "cast") tell("cast", cast(e.data.look ?? null, { outfit: e.data.outfit, date: e.data.date }));
    });
  }
})();

document.querySelector(".dp-go").addEventListener("click", () => { document.querySelector(".dp").classList.remove("fresh"); depict.seek(0); depict.play(); });
</script>
</body>
</html>

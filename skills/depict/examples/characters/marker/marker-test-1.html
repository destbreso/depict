// The camera. A shot is a frame of the board: its center and its width (the
// height follows from 16:9). Between two shots the camera takes van Wijk and
// Nuij's path ("Smooth and efficient zooming and panning", InfoVis 2003),
// the one d3.interpolateZoom ships: it pulls back as it travels and comes in
// at the far end, so a long move never smears the board across the screen.
// This file has no imports: the page inlines it as it is.

const RHO = Math.SQRT2;
const RHO2 = 2;
const RHO4 = 4;

/** A shot from a frame { x, y, w, h }: center and width, the frame grown to 16:9 so all of it shows. */
function shotOf(f, aspect = 16 / 9) {
  const w = Math.max(f.w, f.h * aspect);
  return [f.x + f.w / 2, f.y + f.h / 2, w];
}

/**
 * A shot that shows a frame whole, centered. The caption is written under the
 * board, outside it, so the whole shot is the drawing's.
 */
function shotSafe(f, aspect = 16 / 9) {
  const h = Math.max(f.h, f.w / aspect);
  return [f.x + f.w / 2, f.y + f.h / 2, h * aspect];
}

/** The part of a shot nothing should be drawn outside of: all of it. */
function safeArea(shot, aspect = 16 / 9) {
  const [cx, cy, w] = shot;
  const h = w / aspect;
  return { x: cx - w / 2, y: cy - h / 2, w, h };
}

/** The path from shot a to shot b: a function of u in [0, 1], and the path's length (in the zoom metric). */
function flight(a, b) {
  const [ux0, uy0, w0] = a;
  const [ux1, uy1, w1] = b;
  const dx = ux1 - ux0;
  const dy = uy1 - uy0;
  const d2 = dx * dx + dy * dy;
  if (d2 < 1e-6) {
    const S = Math.log(w1 / w0) / RHO;
    return { S: Math.abs(S), at: (u) => [ux0 + u * dx, uy0 + u * dy, w0 * Math.exp(RHO * u * S)] };
  }
  const d1 = Math.sqrt(d2);
  const b0 = (w1 * w1 - w0 * w0 + RHO4 * d2) / (2 * w0 * RHO2 * d1);
  const b1 = (w1 * w1 - w0 * w0 - RHO4 * d2) / (2 * w1 * RHO2 * d1);
  const r0 = Math.log(Math.sqrt(b0 * b0 + 1) - b0);
  const r1 = Math.log(Math.sqrt(b1 * b1 + 1) - b1);
  const S = (r1 - r0) / RHO;
  return {
    S,
    at(u) {
      const s = u * S;
      const coshr0 = Math.cosh(r0);
      const k = (w0 / (RHO2 * d1)) * (coshr0 * Math.tanh(RHO * s + r0) - Math.sinh(r0));
      return [ux0 + k * dx, uy0 + k * dy, (w0 * coshr0) / Math.cosh(RHO * s + r0)];
    },
  };
}

/** A straight pan between shots, for slides: the next sheet slides in, nothing zooms out. */
function pan(a, b) {
  const S = Math.hypot(b[0] - a[0], b[1] - a[1]) / Math.max(a[2], b[2]);
  return { S, at: (u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u] };
}

/** How long a flight takes, in seconds: longer for longer paths, never a jump and never a crawl. */
const flightTime = (S) => Math.min(2.6, Math.max(0.9, 0.55 + 0.5 * S));

/** Ease in and out, so the camera leaves and arrives gently. */
const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);

/**
 * The camera at time t, from its keys: [{ t0, t1, from, to }] flights and
 * the holds between them. Returns a shot [cx, cy, width].
 */
function cameraAt(keys, t) {
  let shot = keys[0].from;
  for (const k of keys) {
    if (t < k.t0) return shot;
    if (t < k.t1) return (k.pan ? pan : flight)(k.from, k.to).at(ease((t - k.t0) / (k.t1 - k.t0)));
    shot = k.to;
  }
  return shot;
}

// The guide's performance, as a pure function of time: where it stands, how
// it hops, how it squashes and stretches, where its hands go, what it feels,
// where it looks, when it blinks. The timeline writes the track (perform.mjs);

const easeInOut = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
const clamp01 = (u) => Math.max(0, Math.min(1, u));
/** Up over the first share of a span, held, and down over its last: how a bow or a tipped cap comes and goes. */
const envelope = (u, edge = 0.3) => easeInOut(clamp01(Math.min(u, 1 - u) / edge));
const lastAt = (keys, t) => {
  let k = null;
  for (const key of keys) {
    if (key[0] <= t) k = key;
    else break;
  }
  return k;
};

/**
 * The state of an actor at time t: { x, y, facing, lift, sx, sy, lean,
 * front, back, feel, look, blink, cap, shown }. Hands are { hand, bow, glove } in
 * the figure's own frame (x toward the way it faces, y down, origin between
 * its feet); `look` is the pupils' offset in that frame.
 */
function actorAt(actor, t) {
  const tr = actor.track;
  const h = actor.h;
  // where it is: on its spot, or on its way to the next one, hopping
  let x = tr.start[0];
  let y = tr.start[1];
  let facing = tr.start[2];
  let lift = 0;
  let air = 0;
  let settled = -Infinity; // when it last landed
  for (const m of tr.moves) {
    if (t < m.t0) break;
    if (t >= m.t1) {
      x = m.to[0];
      y = m.to[1];
      facing = m.land;
      settled = m.t1;
      continue;
    }
    const u = (t - m.t0) / (m.t1 - m.t0);
    const s = easeInOut(u) * 0.35 + u * 0.65;
    if (m.path) {
      // along its way, at the same share of its length
      const q = along(m.path, s);
      x = q[0];
      y = q[1];
      facing = q[2] || m.facing;
    } else {
      x = m.from[0] + (m.to[0] - m.from[0]) * s;
      y = m.from[1] + (m.to[1] - m.from[1]) * s;
      facing = m.facing;
    }
    const phase = (u * m.hops) % 1;
    air = 4 * phase * (1 - phase);
    lift = m.height * air;
  }
  // a turn to face something, when it came after the last landing
  const turn = lastAt(tr.turns, t);
  if (turn && turn[0] >= settled && !(lift > 0)) facing = turn[1];
  // squash and stretch: stretched in the air, and a springy squash after each landing or jolt. What it is made of
  // says how much: a stiff barrel squashes a little and is still at once; a soft body squashes deep and wobbles on
  // like a jelly (its motion: squash and stretch as multiples, the wobble's frequency, how fast it dies, its breath)
  const mo = actor.motion ?? {};
  const soft = mo.squash ?? 1;
  const freq = mo.freq ?? 13;
  const damp = mo.damp ?? 5.5;
  const window = mo.damp ? Math.min(3, 6.6 / mo.damp) : 1.2;
  let squash = 0;
  for (const [tb, strength] of tr.bounces) {
    if (t < tb) break;
    const d = t - tb;
    if (d < window) squash += strength * Math.exp(-damp * d) * Math.cos(freq * d);
  }
  const breath = Math.sin((2 * Math.PI * t) / (mo.breathPeriod ?? 2.7));
  const stretch = lift > 0 ? (0.09 * air - 0.03) * (mo.stretch ?? 1) : 0;
  const deep = mo.breath ?? 1;
  const sy = (1 - 0.13 * soft * squash + stretch) * (1 + 0.011 * deep * breath);
  const sx = (1 + 0.11 * soft * squash - stretch * 0.6) * (1 - 0.005 * deep * breath);
  // a soft body's top sways over its feet like a jelly on a plate (its skew, in degrees, top toward +x when positive):
  // it lags as it sets off, sloshes on past its feet when it lands, and sways a little on its own
  let skew = 0;
  if (mo.jelly) {
    for (const m of tr.moves) {
      const dir = Math.sign(m.to[0] - m.from[0]);
      if (!dir) continue;
      const d0 = t - m.t0;
      const d1 = t - m.t1;
      if (d0 > 0 && t < m.t1) skew -= dir * mo.jelly * 6 * Math.exp(-4 * d0) * Math.sin(9 * d0);
      if (d1 > 0 && d1 < 2.5) skew += dir * mo.jelly * 9 * Math.exp(-2.6 * d1) * Math.sin(10 * d1);
    }
    for (const [tb, strength] of tr.bounces) {
      if (t < tb) break;
      const d = t - tb;
      if (d < 2) skew += mo.jelly * 3.2 * strength * Math.exp(-3 * d) * Math.sin(11 * d + 0.6);
    }
    skew += mo.jelly * 1.4 * Math.sin((2 * Math.PI * t) / 3.4);
  }
  let lean = lift > 0 ? 7 * air : 0; // leaning into the hop, in degrees
  // a bow: the whole figure leans forward about its feet, and back up
  for (const [t0, t1, deg] of tr.leans ?? []) if (t >= t0 && t < t1) lean += deg * envelope((t - t0) / (t1 - t0));
  // a spin: it turns round where it is, narrowing to its edge and back, as a drawing turns
  let turnScale = 1;
  for (const [t0, t1, turns] of tr.spins ?? []) {
    if (t < t0 || t >= t1) continue;
    const c = Math.cos(2 * Math.PI * turns * easeInOut((t - t0) / (t1 - t0)));
    turnScale = Math.max(0.05, Math.abs(c));
    if (c < 0) facing = -facing;
  }
  // its cap, lifted off and tipped, and put back
  let cap = { lift: 0, angle: 0 };
  for (const [t0, t1, up, deg] of tr.caps ?? []) {
    if (t < t0 || t >= t1) continue;
    const e = envelope((t - t0) / (t1 - t0), 0.35);
    cap = { lift: up * e, angle: deg * e };
  }
  // the arms: the pose of the moment, eased in from the one before
  let cur = null;
  let prev = null;
  for (const key of tr.arms) {
    if (key[0] > t) break;
    prev = cur;
    cur = key;
  }
  const poseOf = (key) => armsFor(actor, key, x, y, facing, t);
  const a = cur ? poseOf(cur) : poseOf([0, "rest"]);
  let front = a.front;
  let back = a.back;
  if (prev) {
    const b = easeInOut(clamp01((t - cur[0]) / 0.24));
    if (b < 1) {
      const p = poseOf(prev);
      front = mixHand(p.front, a.front, b);
      back = mixHand(p.back, a.back, b);
    }
  }
  // what it feels, and where it looks
  const feelKey = lastAt(tr.feel, t);
  const feel = feelKey ? feelKey[1] : "happy";
  const lookKey = lastAt(tr.look, t);
  let look = [0, 0];
  const override = (actor.feelings[feel] ?? {}).look;
  if (override) look = [override[0] * 0.018 * h, override[1] * 0.014 * h];
  else if (lookKey && lookKey[1] != null) {
    const eye = actor.eyes[0];
    const dx = (lookKey[1] - x) * facing - eye[0];
    const dy = lookKey[2] - (y - lift) - eye[1];
    const l = Math.hypot(dx, dy) || 1;
    look = [(dx / l) * 0.018 * h, (dy / l) * 0.014 * h];
  }
  // blinking: a quick close and open
  let blink = 0;
  for (const tb of tr.blinks) {
    if (tb > t) break;
    if (t - tb < 0.16) blink = Math.sin((Math.PI * (t - tb)) / 0.16);
  }
  return { x, y, facing, lift, air, sx: sx * turnScale, sy, lean, skew, front, back, feel, look, blink, cap, shown: t >= tr.appear[0] };
}

/** The point a share u of the way along a polyline, and which way it is heading there (left or right). */
function along(pts, u) {
  let total = 0;
  for (let i = 2; i < pts.length; i += 2) total += Math.hypot(pts[i] - pts[i - 2], pts[i + 1] - pts[i - 1]);
  let left = total * Math.max(0, Math.min(1, u));
  for (let i = 2; i < pts.length; i += 2) {
    const d = Math.hypot(pts[i] - pts[i - 2], pts[i + 1] - pts[i - 1]);
    if (left <= d || i === pts.length - 2) {
      const t = d ? Math.min(1, left / d) : 1;
      const dx = pts[i] - pts[i - 2];
      return [pts[i - 2] + dx * t, pts[i - 1] + (pts[i + 1] - pts[i - 1]) * t, Math.abs(dx) > 1e-6 ? Math.sign(dx) : 0];
    }
    left -= d;
  }
  return [pts[pts.length - 2], pts[pts.length - 1], 0];
}

/** The hands for an arms key [t, pose, tx, ty]: the pose's own, or a hand aimed at the target (in board units). */
function armsFor(actor, key, x, y, facing, t) {
  const [t0, pose, tx, ty] = key;
  const most = key[4] ?? Infinity; // how far the arm may reach before something in its way
  const P = actor.poses[pose] ?? actor.poses.rest;
  const at = ([u, v]) => [u * actor.h, (v - 0.99) * actor.h];
  const hand = (side) => ({ hand: at(P[side].hand), bow: at(P[side].bow), glove: P[side].glove });
  const front = hand("front");
  const back = hand("back");
  if ((pose === "point" || pose === "present") && tx != null) {
    // the front arm reaches toward the target from its shoulder: as far as an arm goes, and never back over its own head
    const sh = actor.shoulders.front;
    let dx = (tx - x) * facing - sh[0];
    let dy = ty - y - sh[1];
    const l = Math.hypot(dx, dy) || 1;
    dx /= l;
    dy /= l;
    if (dx < 0.25) {
      dx = 0.25;
      dy = Math.sign(dy || 1) * Math.sqrt(1 - dx * dx);
    }
    // as far as an arm goes, and never past the thing pointed at (less a pointer's length, when it holds one)
    const reach = Math.max(0.05 * actor.h, Math.min((actor.reach ?? 0.36) * actor.h, most, l - (actor.hold === "pointer" ? 0.27 * actor.h : 0)));
    const hx = sh[0] + dx * reach;
    const hy = sh[1] + dy * reach;
    // the hose sags a little under the line from shoulder to hand
    const nx = -dy;
    const ny = dx;
    const sag = ny > 0 ? 1 : -1;
    front.hand = [hx, hy];
    front.bow = [(sh[0] + hx) / 2 + nx * sag * 0.07 * actor.h, (sh[1] + hy) / 2 + ny * sag * 0.07 * actor.h];
    front.glove = "point";
  }
  if (pose === "wave") {
    // the hand swings side to side
    const w = Math.sin(2 * Math.PI * 2.4 * (t - t0));
    front.hand = [front.hand[0] + w * 0.055 * actor.h, front.hand[1] + Math.abs(w) * 0.012 * actor.h];
    front.bow = [front.bow[0] + w * 0.03 * actor.h, front.bow[1]];
  }
  if (pose === "cheer") {
    const w = Math.sin(2 * Math.PI * 1.8 * (t - t0));
    front.hand = [front.hand[0] + w * 0.02 * actor.h, front.hand[1] - Math.abs(w) * 0.02 * actor.h];
    back.hand = [back.hand[0] - w * 0.02 * actor.h, back.hand[1] - Math.abs(w) * 0.02 * actor.h];
  }
  if (pose === "scratch") {
    const w = Math.sin(2 * Math.PI * 3 * (t - t0));
    front.hand = [front.hand[0] + w * 0.012 * actor.h, front.hand[1] + w * 0.008 * actor.h];
  }
  return { front, back };
}

const mixHand = (a, b, u) => ({
  hand: [a.hand[0] + (b.hand[0] - a.hand[0]) * u, a.hand[1] + (b.hand[1] - a.hand[1]) * u],
  bow: [a.bow[0] + (b.bow[0] - a.bow[0]) * u, a.bow[1] + (b.bow[1] - a.bow[1]) * u],
  glove: u < 0.5 ? a.glove : b.glove,
});

/** A rubber-hose arm from the shoulder through its bow to the hand, as a polyline with the hose's own fixed wobble. */
function hosePath(sh, bow, hand, wobble) {
  const n = wobble.length;
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const s = 1 - t;
    const x = s * s * sh[0] + 2 * s * t * bow[0] + t * t * hand[0];
    const y = s * s * sh[1] + 2 * s * t * bow[1] + t * t * hand[1];
    // the direction along the curve, for the sideways wobble
    const dx = 2 * s * (bow[0] - sh[0]) + 2 * t * (hand[0] - bow[0]);
    const dy = 2 * s * (bow[1] - sh[1]) + 2 * t * (hand[1] - bow[1]);
    const l = Math.hypot(dx, dy) || 1;
    const w = wobble[i] * Math.sin(Math.PI * t);
    out.push(x - (dy / l) * w, y + (dx / l) * w);
  }
  return out;
}

// The player: the page's runtime. Everything on screen is a pure function of
// the time t (which strokes exist and how far each one is drawn, where the
// camera is, which sentence is said), so playing, scrubbing and capturing a

// ends, the board stays: zoom it, drag it, and tap any part to hear it again.

(function () {

  });

  }

  hoverBox.setAttribute("class", "dp-hover");

  pen.setAttribute("class", "dp-pen");
  pen.innerHTML =
    '<g transform="rotate(-38)"><path d="M0 0 L-6 -16 L6 -16 Z" fill="#2b2b28"/><rect x="-8" y="-22" width="16" height="10" rx="2" fill="#3a3a36"/><rect x="-11" y="-118" width="22" height="98" rx="6" fill="#f4f1e8" stroke="#2b2b28" stroke-width="3"/><rect x="-11" y="-118" width="22" height="26" rx="6" fill="var(--dp-accent)"/></g>';

  const pathOf = (pts, n) => {

  const partial = (s, d) => {

    const x = s.pts[2 * i - 2] + (s.pts[2 * i] - s.pts[2 * i - 2]) * u;
    const y = s.pts[2 * i - 1] + (s.pts[2 * i + 1] - s.pts[2 * i - 1]) * u;

  const PAPERC = "#fbfaf7";
  const actors = (S.actors || []).map((A) => {
    const floor = node("g", {}, shadow);

    const backArmFill = A.arm.fill != null ? node("path", { stroke: S.palette[A.arm.fill], "stroke-width": A.arm.fillWidth }, root) : null;
    const backGloveG = node("g", {}, root);
    const bodyUnder = node("g", {}, root);
    const bodyInk = node("g", {}, root);
    // the cap, with whatever hat is on it: one group, so it can be lifted and tipped
    const capG = node("g", {}, root);
    const [capUnder, capInk, hatUnder, hatInk] = [0, 1, 2, 3].map(() => node("g", {}, capG));
    const face = node("g", {}, root);
    const wearG = node("g", {}, root);
    const [wearUnder, wearInk] = [0, 1].map(() => node("g", {}, wearG));
    const frontArm = node("path", { stroke: INKC, "stroke-width": A.arm.width }, root);
    const frontArmFill = A.arm.fill != null ? node("path", { stroke: S.palette[A.arm.fill], "stroke-width": A.arm.fillWidth }, root) : null;
    const pointerG = node("g", {}, root); // a pointer, under the fist that holds it
    const frontGloveG = node("g", {}, root);
    const [pointerUnder, pointerInk] = [0, 1].map(() => node("g", {}, pointerG));
    // what it holds, upright in its back hand, in front of it
    const heldG = node("g", {}, root);
    const [heldUnder, heldInk] = [0, 1].map(() => node("g", {}, heldG));
    const layered = { body: [bodyUnder, bodyInk], cap: [capUnder, capInk], hat: [hatUnder, hatInk], wear: [wearUnder, wearInk], pointer: [pointerUnder, pointerInk], held: [heldUnder, heldInk] };
    const groups = new Map();
    const groupFor = (part) => {
      if (groups.has(part)) return groups.get(part);

    const strokes = A.strokes.map((st) => {

      n.style.display = "none";
      return Object.assign(measured(st.pts), { t0: st.t0, t1: st.t1, node: n, state: 0 });
    });
    const gloveSet = (parent) => {
      const set = {};
      for (const kind in A.gloves) {
        const gl = A.gloves[kind];
        const g = node("g", {}, parent);
        for (const f of gl.fill) node("path", { d: pathOf(f, f.length), stroke: A.gloveFill != null ? S.palette[A.gloveFill] : PAPERC, "stroke-width": gl.fillWidth }, g);
        for (const l of gl.lines) node("path", { d: pathOf(l, l.length), stroke: INKC, "stroke-width": A.gloveWidth }, g);

    };
    return { A, floor, root, backArm, frontArm, backArmFill, frontArmFill, backGloveG, frontGloveG, capG, heldG, pointerG, gloves: { back: gloveSet(backGloveG), front: gloveSet(frontGloveG) }, strokes, groups };

  const revealed = (rv, t) => (!rv ? 1 : t < rv[0] ? 0 : t >= rv[1] ? 1 : (t - rv[0]) / (rv[1] - rv[0]));

  function renderActor(X, t, wall) {
    const A = X.A;

    X.root.style.display = st.shown ? "" : "none";
    X.floor.style.display = st.shown ? "" : "none";
    if (!st.shown) return null;
    if (wall != null) {
      const mo = A.motion || {};
      const deep = mo.breath ?? 1;
      const b = Math.sin((2 * Math.PI * wall) / (mo.breathPeriod ?? 2.7));
      st.sy = 1 + 0.011 * deep * b;

    }
    X.root.setAttribute("transform", `translate(${st.x} ${st.y - st.lift}) rotate(${st.lean * st.facing})${st.skew ? ` skewX(${-st.skew})` : ""} scale(${st.facing * st.sx} ${st.sy})`);

        s.state = 0;
        continue;
      }
      if (s.state === 0) s.node.style.display = "";
      if (state === 2) {

      } else {
        const p = partial(s, s.len * ((t - s.t0) / (s.t1 - s.t0)));

      s.state = state;
    }
    // the feeling of the moment: its brows, its mouth, its eyes
    const F = A.feelings[st.feel] || A.feelings.happy;
    for (const [part, g] of X.groups) {
      const m = /^(brows|mouth):(\w+)$/.exec(part);
      let on = null;
      if (m) on = (m[1] === "brows" ? F.brows : F.mouth) === m[2];
      else if (/^squint\d$/.test(part)) on = F.eyes === "squint" || (F.eyes === "wink" && part === "squint1");
      else if (/^eyes\d$/.test(part)) on = !(F.eyes === "squint" || (F.eyes === "wink" && part === "eyes1"));
      if (on != null && g.__on !== on) {

      }
    }
    A.eyes.forEach(([cx, cy], i) => {
      const g = X.groups.get(`eyes${i}`);

      if (g) g.setAttribute("transform", `translate(${cx} ${cy}) scale(${wide} ${wide * (1 - 0.92 * st.blink)}) translate(${-cx} ${-cy})`);

    const cp = A.capPivot || [0, 0];

    }

      const arm = st[side];

      const nf = side === "back" ? X.backArmFill : X.frontArmFill;
      const frac = revealed(A.reveal && A.reveal[side === "back" ? "armBack" : "armFront"], t);

        if (nf) nf.style.display = "none";
      } else {
        n.style.display = "";
        const m = measured(hosePath(A.shoulders[side], arm.bow, arm.hand, A.arm.hose));
        let d;
        if (frac >= 1) d = pathOf(m.pts, m.pts.length);
        else {
          const p = partial(m, m.len * frac);

          nf.setAttribute("d", d);
        }
      }
      const gf = revealed(A.reveal && A.reveal[side === "back" ? "gloveBack" : "gloveFront"], t);
      const gG = side === "back" ? X.backGloveG : X.frontGloveG;
      const ang = (Math.atan2(arm.hand[1] - arm.bow[1], arm.hand[0] - arm.bow[0]) * 180) / Math.PI;
      gG.setAttribute("transform", `translate(${arm.hand[0]} ${arm.hand[1]}) rotate(${ang}) scale(1 ${side === "front" ? 1 : -1})`);
      gG.setAttribute("opacity", Math.min(1, gf * 1.6));

      const glove = side === "front" && A.hold === "pointer" ? "fist" : arm.glove;
      if (side === "front" && A.hold === "pointer") {

        X.pointerG.setAttribute("opacity", Math.min(1, gf * 1.6));

  }

  const card = (S.outro ? S.outro.card : []).map((c) => {
    const n = node("path", { stroke: S.palette[c.c], "stroke-width": c.w, fill: "none" }, outroLayer);

  const smooth = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
  /** The outro at time t: the circle closing on the guide, then the title written on the dark. Played, never paused over. */

    if (!on) return;
    const I = O.iris;
    const k = VW / shot[2];
    const sx = (I.cx - shot[0]) * k + VW / 2;
    const sy = (I.cy - shot[1]) * k + VH / 2;
    const far = Math.hypot(Math.max(sx, VW - sx), Math.max(sy, VH - sy)) / k;

      }
      c.node.style.display = "";

  }

  let now = 0;
  /** Draws the board as it is at time t. */
  function render(t) {
    now = Math.max(0, Math.min(T, t));

    let tip = null;
    for (const s of strokes) {
      const state = now < s.t0 ? 0 : now >= s.t1 ? 2 : 1;

          s.shown = 0;

        s.state = 0;
        continue;
      }
      const node = nodeOf(s);
      if (s.shown !== 1) {
        node.style.display = "";
        s.shown = 1;
      }
      if (state === 2) {
        if (s.state !== 2) node.setAttribute("d", pathOf(s.pts, s.pts.length));
      } else {
        const p = partial(s, s.len * ((now - s.t0) / (s.t1 - s.t0)));

    }

    return null;

  let captionFor = -1;

    const i = b ? b.i : -1;

  function ended() {

    if (veil) {

  // where the film was, while it plays, kept every frame: a page reloaded under the viewer (a preview that

    if (live.resume) play();
  }
  liveBox.querySelector(".dp-live-close").addEventListener("click", closeLive);
  root.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") closeLive();
  });
  // a beat that opens a live part does it as the beat starts, and the explanation waits for the reader
  let lastBeat = -1;
  const watchOpen = () => {
    const b = beatAt(now);
    const i = b ? b.i : -1;
    if (i !== lastBeat) {
      lastBeat = i;
      if (playing && b && b.open != null) setTimeout(() => openLive(S.elements[b.open], true), 900);
    }
  };

  // paused or ended, the guide stays alive: it breathes and blinks while the reader looks round the board
  if (!capture && actors.length) {
    const idle = (ms) => {
      if (!playing && !reduced) for (const X of actors) renderActor(X, now, ms / 1000);
      requestAnimationFrame(idle);
    };
    requestAnimationFrame(idle);
  }

  window.depict = { render, seek, play, pause, duration: T, explore: S.explore, speed: S.speed || 1, beats, get time() { return now; } };
  hoverBox.style.display = "none";
  const at = q.get("t");
  let resume = null;
  try {
    const r = JSON.parse(sessionStorage.getItem(KEY) || "null");
    if (r && Date.now() - r.at < 20000 && r.t < T) resume = r.t;
  } catch {}
  if (!capture && at == null && resume != null) {
    // it was playing a moment ago: go on from there
    seek(resume);
    play();
  } else {
    render(at != null ? Number(at) : capture ? 0 : S.explore ?? T);
    if (!capture && at == null) root.classList.add("ended", "fresh");
  }
  document.documentElement.dataset.ready = "1";
})();

document.querySelector(".dp-go").addEventListener("click", () => { document.querySelector(".dp").classList.remove("fresh"); depict.seek(0); depict.play(); });
</script>

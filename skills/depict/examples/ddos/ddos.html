  <noscript><p>This board plays with JavaScript. Its explanation: A DDoS attack floods a site with more requests than it can answer. Real people send a few hundred requests a second. A botnet sends tens of thousands, from machines all over the world. No single fix stops it, so the edge puts layers in front of the site. Rules block known attackers, and a rate limit caps each address. A challenge in the browser lets people through and stops scripts. The cache answers images and scripts before they reach the servers. Only what gets past every layer reaches the site. Behind the edge, autoscaling adds servers, but each takes about a minute. Open the figure, switch each layer off, and watch what breaks.</p></noscript>

// The camera. A shot is a frame of the board: its center and its width (the
// height follows from 16:9). Between two shots the camera takes van Wijk and
// Nuij's path ("Smooth and efficient zooming and panning", InfoVis 2003),
// the one d3.interpolateZoom ships: it pulls back as it travels and comes in
// at the far end, so a long move never smears the board across the screen.
// This file has no imports: the page inlines it as it is.

const RHO = Math.SQRT2;
const RHO2 = 2;
const RHO4 = 4;

/** A shot from a frame { x, y, w, h }: center and width, the frame grown to 16:9 so all of it shows. */
function shotOf(f, aspect = 16 / 9) {
  const w = Math.max(f.w, f.h * aspect);
  return [f.x + f.w / 2, f.y + f.h / 2, w];
}

/** The share of a shot's height at the bottom that the caption can cover. */
const CAPTION_BAND = 0.15;

/**
 * A shot that shows a frame above the caption's band: the frame fits the
 * shot's upper part, centered in it, so nothing drawn lands under a caption.
 */
function shotSafe(f, aspect = 16 / 9) {
  const h = Math.max(f.h / (1 - CAPTION_BAND), f.w / aspect);
  return [f.x + f.w / 2, f.y + f.h / 2 + (CAPTION_BAND / 2) * h, h * aspect];
}

/** The part of a shot nothing should be drawn outside of: the shot, less the caption's band. */
function safeArea(shot, aspect = 16 / 9) {
  const [cx, cy, w] = shot;
  const h = w / aspect;
  return { x: cx - w / 2, y: cy - h / 2, w, h: h * (1 - CAPTION_BAND) };
}

/** The path from shot a to shot b: a function of u in [0, 1], and the path's length (in the zoom metric). */
function flight(a, b) {
  const [ux0, uy0, w0] = a;
  const [ux1, uy1, w1] = b;
  const dx = ux1 - ux0;
  const dy = uy1 - uy0;
  const d2 = dx * dx + dy * dy;
  if (d2 < 1e-6) {
    const S = Math.log(w1 / w0) / RHO;
    return { S: Math.abs(S), at: (u) => [ux0 + u * dx, uy0 + u * dy, w0 * Math.exp(RHO * u * S)] };
  }
  const d1 = Math.sqrt(d2);
  const b0 = (w1 * w1 - w0 * w0 + RHO4 * d2) / (2 * w0 * RHO2 * d1);
  const b1 = (w1 * w1 - w0 * w0 - RHO4 * d2) / (2 * w1 * RHO2 * d1);
  const r0 = Math.log(Math.sqrt(b0 * b0 + 1) - b0);
  const r1 = Math.log(Math.sqrt(b1 * b1 + 1) - b1);
  const S = (r1 - r0) / RHO;
  return {
    S,
    at(u) {
      const s = u * S;
      const coshr0 = Math.cosh(r0);
      const k = (w0 / (RHO2 * d1)) * (coshr0 * Math.tanh(RHO * s + r0) - Math.sinh(r0));
      return [ux0 + k * dx, uy0 + k * dy, (w0 * coshr0) / Math.cosh(RHO * s + r0)];
    },
  };
}

/** A straight pan between shots, for slides: the next sheet slides in, nothing zooms out. */
function pan(a, b) {
  const S = Math.hypot(b[0] - a[0], b[1] - a[1]) / Math.max(a[2], b[2]);
  return { S, at: (u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u] };
}

/** How long a flight takes, in seconds: longer for longer paths, never a jump and never a crawl. */
const flightTime = (S) => Math.min(2.6, Math.max(0.9, 0.55 + 0.5 * S));

/** Ease in and out, so the camera leaves and arrives gently. */
const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);

/**
 * The camera at time t, from its keys: [{ t0, t1, from, to }] flights and
 * the holds between them. Returns a shot [cx, cy, width].
 */
function cameraAt(keys, t) {
  let shot = keys[0].from;
  for (const k of keys) {
    if (t < k.t0) return shot;
    if (t < k.t1) return (k.pan ? pan : flight)(k.from, k.to).at(ease((t - k.t0) / (k.t1 - k.t0)));
    shot = k.to;
  }
  return shot;
}

// The guide's performance, as a pure function of time: where it stands, how
// it hops, how it squashes and stretches, where its hands go, what it feels,
// where it looks, when it blinks. The timeline writes the track (perform.mjs);
// the page evaluates it every frame, so playing, scrubbing and capturing a

  let k = null;
  for (const key of keys) {
    if (key[0] <= t) k = key;
    else break;
  }
  return k;
};

/**

/** The point a share u of the way along a polyline, and which way it is heading there (left or right). */
function along(pts, u) {
  let total = 0;
  for (let i = 2; i < pts.length; i += 2) total += Math.hypot(pts[i] - pts[i - 2], pts[i + 1] - pts[i - 1]);
  let left = total * Math.max(0, Math.min(1, u));
  for (let i = 2; i < pts.length; i += 2) {
    const d = Math.hypot(pts[i] - pts[i - 2], pts[i + 1] - pts[i - 1]);
    if (left <= d || i === pts.length - 2) {
      const t = d ? Math.min(1, left / d) : 1;
      const dx = pts[i] - pts[i - 2];
      return [pts[i - 2] + dx * t, pts[i - 1] + (pts[i + 1] - pts[i - 1]) * t, Math.abs(dx) > 1e-6 ? Math.sign(dx) : 0];
    }
    left -= d;
  }
  return [pts[pts.length - 2], pts[pts.length - 1], 0];
}

/** The hands for an arms key [t, pose, tx, ty]: the pose's own, or a hand aimed at the target (in board units). */
function armsFor(actor, key, x, y, facing, t) {
  const [t0, pose, tx, ty] = key;
  const P = actor.poses[pose] ?? actor.poses.rest;
  const at = ([u, v]) => [u * actor.h, (v - 0.99) * actor.h];
  const hand = (side) => ({ hand: at(P[side].hand), bow: at(P[side].bow), glove: P[side].glove });

  const back = hand("back");

    const sh = actor.shoulders.front;
    let dx = (tx - x) * facing - sh[0];
    let dy = ty - y - sh[1];
    const l = Math.hypot(dx, dy) || 1;
    dx /= l;
    dy /= l;
    if (dx < 0.25) {

      dy = Math.sign(dy || 1) * Math.sqrt(1 - dx * dx);
    }
    const reach = 0.36 * actor.h;
    const hx = sh[0] + dx * reach;
    const hy = sh[1] + dy * reach;
    // the hose sags a little under the line from shoulder to hand
    const nx = -dy;
    const ny = dx;
    const sag = ny > 0 ? 1 : -1;
    front.hand = [hx, hy];
    front.bow = [(sh[0] + hx) / 2 + nx * sag * 0.07 * actor.h, (sh[1] + hy) / 2 + ny * sag * 0.07 * actor.h];

  if (pose === "scratch") {

    front.hand = [front.hand[0] + w * 0.012 * actor.h, front.hand[1] + w * 0.008 * actor.h];
  }
  return { front, back };
}

const mixHand = (a, b, u) => ({
  hand: [a.hand[0] + (b.hand[0] - a.hand[0]) * u, a.hand[1] + (b.hand[1] - a.hand[1]) * u],
  bow: [a.bow[0] + (b.bow[0] - a.bow[0]) * u, a.bow[1] + (b.bow[1] - a.bow[1]) * u],

/** A rubber-hose arm from the shoulder through its bow to the hand, as a polyline with the hose's own fixed wobble. */
function hosePath(sh, bow, hand, wobble) {
  const n = wobble.length;
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const s = 1 - t;
    const x = s * s * sh[0] + 2 * s * t * bow[0] + t * t * hand[0];
    const y = s * s * sh[1] + 2 * s * t * bow[1] + t * t * hand[1];
    // the direction along the curve, for the sideways wobble
    const dx = 2 * s * (bow[0] - sh[0]) + 2 * t * (hand[0] - bow[0]);
    const dy = 2 * s * (bow[1] - sh[1]) + 2 * t * (hand[1] - bow[1]);
    const l = Math.hypot(dx, dy) || 1;
    const w = wobble[i] * Math.sin(Math.PI * t);
    out.push(x - (dy / l) * w, y + (dx / l) * w);
  }
  return out;
}

  let captionFor = -1;
  function showCaption(b) {
    const i = b ? b.i : -1;
    if (i === captionFor) return;
    captionFor = i;
    // the last sentence stays in the caption while it fades out
    if (b) caption.textContent = b.say;
    caption.classList.toggle("on", !!b);
  }

  // playing
  let playing = false;
  let speed = 1;
  let last = 0;
  const tick = (ms) => {
    if (!playing) return;
    const dt = last ? (ms - last) / 1000 : 0;
    last = ms;
    render(now + dt * speed);
    watchOpen();
    if (now >= T) {
      playing = false;
      ended();
      return;
    }
    requestAnimationFrame(tick);
  };
  function play() {
    if (now >= T) seek(0);
    view = null;
    playing = true;
    last = 0;
    root.classList.add("playing");
    root.classList.remove("ended");
    requestAnimationFrame(tick);
  }
  function pause() {
    playing = false;
    root.classList.remove("playing");
  }
  function seek(t) {
    view = null;
    render(t);
  }
  function ended() {
    root.classList.remove("playing");
    root.classList.add("ended");
  }

  // the bar
  const bar = root.querySelector(".dp-bar");
  const playBtn = bar.querySelector(".dp-play");
  const scrub = bar.querySelector(".dp-scrub");
  const clock = bar.querySelector(".dp-time");
  const ticks = bar.querySelector(".dp-ticks");
  scrub.max = String(T);
  for (const b of beats) {
    const m = document.createElement("i");
    m.style.left = `${(100 * b.t0) / T}%`;
    ticks.append(m);
  }
  const fmt = (s) => {
    const r = Math.round(s);
    return `${Math.floor(r / 60)}:${String(r % 60).padStart(2, "0")}`;
  };
  function updateBar() {
    scrub.value = String(now);
    clock.textContent = `${fmt(now)} / ${fmt(T)}`;
    playBtn.setAttribute("aria-label", playing ? "Pause" : now >= T ? "Replay" : "Play");
  }
  playBtn.addEventListener("click", () => (playing ? pause() : play()));
  scrub.addEventListener("input", () => {
    pause();
    seek(Number(scrub.value));
  });
  const step = (dir) => {
    pause();
    const i = beats.findIndex((b) => now < b.t1);
    const cur = i < 0 ? beats.length : i;
    const j = Math.max(0, Math.min(beats.length - 1, cur + dir));
    seek(dir < 0 && now - beats[cur]?.t0 > 1 ? beats[cur].t0 : beats[j].t0);
  };
  bar.querySelector(".dp-prev").addEventListener("click", () => step(-1));
  bar.querySelector(".dp-next").addEventListener("click", () => step(1));
  bar.querySelector(".dp-speed").addEventListener("change", (e) => (speed = Number(e.target.value)));
  root.addEventListener("keydown", (e) => {
    if (e.target.closest("select")) return;
    if (e.key === " " || e.key === "k") {
      e.preventDefault();
      playing ? pause() : play();
    } else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "Home") seek(0);
    else if (e.key === "End") seek(T);
  });

  // exploring: zoom and drag the board; tap a part to hear it again
  const toBoard = (ev) => {
    const r = svg.getBoundingClientRect();
    const sx = ((ev.clientX - r.left) / r.width) * VW;
    const sy = ((ev.clientY - r.top) / r.height) * VH;
    const k = shotNow[2] / VW;
    return [shotNow[0] + (sx - VW / 2) * k, shotNow[1] + (sy - VH / 2) * k];
  };
  const visible = (e) => now >= e.t0;
  const hit = (ev) => {
    const [x, y] = toBoard(ev);
    let best = null;
    for (const e of S.elements) {
      if (!visible(e) || e.kind === "story") continue;
      const [bx, by, bw, bh] = e.box;
      if (x >= bx - 12 && x <= bx + bw + 12 && y >= by - 12 && y <= by + bh + 12 && (!best || bw * bh < best.box[2] * best.box[3])) best = e;
    }
    return best;
  };
  svg.addEventListener(
    "wheel",
    (ev) => {
      ev.preventDefault();
      pause();
      const [x, y] = toBoard(ev);
      const f = Math.exp(ev.deltaY * 0.0015);
      const w = Math.min(S.overview[2] * 1.6, Math.max(300, shotNow[2] * f));
      // zoom about the pointer
      const g = w / shotNow[2];
      view = [x + (shotNow[0] - x) * g, y + (shotNow[1] - y) * g, w];
      setCam(view);
    },
    { passive: false },
  );
  let drag = null;
  svg.addEventListener("pointerdown", (ev) => {
    drag = { x: ev.clientX, y: ev.clientY, shot: shotNow, moved: false };
    svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener("pointermove", (ev) => {
    if (drag) {
      const r = svg.getBoundingClientRect();
      const k = drag.shot[2] / r.width;
      const dx = (ev.clientX - drag.x) * k;
      const dy = (ev.clientY - drag.y) * k;
      if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) > 4) {
        drag.moved = true;
        pause();
        view = [drag.shot[0] - dx, drag.shot[1] - dy, drag.shot[2]];
        setCam(view);
      }
      return;
    }
    const e = playing ? null : hit(ev);
    svg.style.cursor = e ? "pointer" : "grab";
    if (e) {
      const [bx, by, bw, bh] = e.box;
      hoverBox.setAttribute("x", bx - 14);
      hoverBox.setAttribute("y", by - 14);
      hoverBox.setAttribute("width", bw + 28);
      hoverBox.setAttribute("height", bh + 28);
      hoverBox.style.display = "";
    } else hoverBox.style.display = "none";
  });
  svg.addEventListener("pointerup", (ev) => {
    const d = drag;
    drag = null;
    if (d && d.moved) return;
    if (playing) return pause();
    // the guide answers a tap with a hop and a wave
    const [bx, by] = toBoard(ev);
    for (const X of actors) {
      const st = actorAt(X.A, now);
      if (st.shown && Math.abs(bx - st.x) < 0.36 * X.A.h && by < st.y + 10 && by > st.y - X.A.h) {
        X.react = performance.now() / 1000;
        return;
      }
    }
    const e = hit(ev);
    if (e && e.figure) openLive(e, false);
    else if (e) {
      // back to the moment this part was explained, and on from there
      seek(beats[e.beat].t0);
      play();
    } else play();
  });
  svg.addEventListener("dblclick", () => {
    view = null;
    setCam(camAt(now));
  });

  // live parts: an item with a Dissect figure opens into it, grown from where the item sits on the board
  const liveBox = root.querySelector(".dp-live");
  const frameEl = root.querySelector(".dp-frame");
  const live = { open: false, resume: false };
  const screenRect = (box) => {
    const fr = frameEl.getBoundingClientRect();
    const k = VW / shotNow[2];
    const s = fr.width / VW;
    const [bx, by, bw, bh] = box;
    return { x: ((bx - shotNow[0]) * k + VW / 2) * s, y: ((by - shotNow[1]) * k + VH / 2) * s, w: bw * k * s, h: bh * k * s, fw: fr.width, fh: fr.height };
  };
  function openLive(e, resume) {
    if (capture || !e.figure) return;
    pause();
    live.open = true;
    live.resume = resume;
    let frame = liveBox.querySelector("iframe");
    if (!frame || frame.dataset.src !== e.figure) {
      frame?.remove();
      frame = document.createElement("iframe");
      frame.dataset.src = e.figure;
      frame.src = e.figure;
      frame.title = `${e.label}: a running figure`;
      liveBox.prepend(frame);
    }
    liveBox.querySelector(".dp-live-name").textContent = `${e.label}, running`;
    const r = screenRect(e.box);
    liveBox.style.transition = "none";
    liveBox.style.transform = `translate(${r.x}px, ${r.y}px) scale(${r.w / r.fw}, ${r.h / r.fh})`;
    liveBox.style.opacity = "0.4";
    liveBox.hidden = false;
    liveBox.offsetWidth; // the start state is laid out before the transition runs
    liveBox.style.transition = "";
    liveBox.style.transform = "none";
    liveBox.style.opacity = "1";
    liveBox.dataset.el = String(S.elements.indexOf(e));
    liveBox.querySelector(".dp-live-close").focus();
  }
  function closeLive() {
    if (!live.open) return;
    live.open = false;
    const e = S.elements[Number(liveBox.dataset.el)];
    const r = screenRect(e.box);
    liveBox.style.transform = `translate(${r.x}px, ${r.y}px) scale(${r.w / r.fw}, ${r.h / r.fh})`;
    liveBox.style.opacity = "0";
    setTimeout(() => (liveBox.hidden = true), 450);
    root.focus();
    if (live.resume) play();
  }
  liveBox.querySelector(".dp-live-close").addEventListener("click", closeLive);
  root.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") closeLive();
  });
  // a beat that opens a live part does it as the beat starts, and the explanation waits for the reader
  let lastBeat = -1;
  const watchOpen = () => {
    const b = beatAt(now);
    const i = b ? b.i : -1;
    if (i !== lastBeat) {
      lastBeat = i;
      if (playing && b && b.open != null) setTimeout(() => openLive(S.elements[b.open], true), 900);
    }
  };

  // paused or ended, the guide stays alive: it breathes and blinks while the reader looks round the board
  if (!capture && actors.length) {
    const idle = (ms) => {
      if (!playing && !reduced) for (const X of actors) renderActor(X, now, ms / 1000);
      requestAnimationFrame(idle);
    };
    requestAnimationFrame(idle);
  }

  window.depict = { render, seek, play, pause, duration: T, beats, get time() { return now; } };
  hoverBox.style.display = "none";
  const at = q.get("t");
  render(at != null ? Number(at) : capture ? 0 : T);
  if (!capture && at == null) root.classList.add("ended", "fresh");
  document.documentElement.dataset.ready = "1";
})();

document.querySelector(".dp-go").addEventListener("click", () => { document.querySelector(".dp").classList.remove("fresh"); depict.seek(0); depict.play(); });
</script>
</body>
</html>

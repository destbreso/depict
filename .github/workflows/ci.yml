name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Kit, examples and the browser check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests (the script, the hand, the camera, every example's audit)
        run: npm test

      - name: Check every character and picture its model sheet and test boards
        run: for c in marker stuart; do node skills/depict/scripts/character.mjs "$c" --out shots/characters; done

      - name: Build, audit and check every example in headless Chrome
        run: |
          for board in skills/depict/examples/*/board.mjs; do
            node skills/depict/scripts/build.mjs "$board" --audit
            node skills/depict/scripts/check.mjs "${board%board.mjs}$(basename "$(dirname "$board")").html" --out shots
          done
